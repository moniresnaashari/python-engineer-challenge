[project]
name = "whats-for-dinner"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]

requires-python = ">=3.12"
dependencies = [
    "haystack-ai==2.12.0",

    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.27.0",

    # Database
    "sqlalchemy>=2.0.32",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.6",
    "pgvector>=0.3.6",

    # OpenAI
    "openai>=1.40.0",

    # Configuration
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",

    # Data ingestion
    "pandas>=2.2.2",

    # API / uploads
    "python-multipart>=0.0.9",
    "pillow>=10.4.0",

    # HTTP client
    "httpx>=0.27.0",

    # Optional but useful for Haystack embedding/document handling
    "numpy>=1.26.4",

    # Testing dependencies  
    "pytest>=7.4.0",
    "anyio[test]>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["whats_for_dinner*"]


[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
